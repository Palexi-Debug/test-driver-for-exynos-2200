name: Build ExynosGTA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Treiber bauen (NDK ist auf dem Runner vorinstalliert)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          chmod +x build.sh
          ./build.sh "$NDK"
      - uses: actions/upload-artifact@v4
        with:
          name: ExynosGTA-0.2
          path: ExynosGTA-0.2.zip
