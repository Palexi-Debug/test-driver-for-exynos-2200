name: Build ExynosGTA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Treiber bauen (NDK ist auf dem Runner vorinstalliert)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          chmod +x build.sh
          ./build.sh "$NDK"
          echo "--- Inhalt des Treiber-ZIPs ---"
          unzip -l ExynosGTA-0.2.zip
          file out/libvulkan_exynos_gta.so
      # Die Dateien liegen direkt im Artifact-ZIP (kein verschachteltes ZIP):
      # das heruntergeladene ZIP ist selbst der Treiber.
      - uses: actions/upload-artifact@v4
        with:
          name: ExynosGTA-0.2-driver
          path: |
            out/libvulkan_exynos_gta.so
            out/meta.json
          if-no-files-found: error
